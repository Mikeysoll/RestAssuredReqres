plugins {
    id 'java-library'
    id "io.freefair.lombok" version "6.0.0-m2"
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'io.rest-assured:rest-assured:5.3.1'
    testImplementation 'io.rest-assured:json-path:5.3.1'
    testImplementation 'io.rest-assured:json-schema-validator:5.3.1'

    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    testImplementation 'com.fasterxml.jackson.core:jackson-annotations:2.17.2'
    testImplementation 'com.fasterxml.jackson.core:jackson-core:2.17.2'

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.0"
    testImplementation 'org.slf4j:slf4j-simple:2.0.7'

    testImplementation 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'

    testImplementation 'io.qameta.allure:allure-rest-assured:2.29.0'
}

tasks.withType(Test) {
    useJUnitPlatform()

    testLogging {
        lifecycle {
            events "started", "skipped", "failed", "standard_error", "standard_out"
            exceptionFormat "short"
        }
    }
}